; Focus Buddy firmware — PlatformIO project
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor   (set -DFB_LIGHT_SLEEP=0 while debugging, USB serial drops in light sleep)

[platformio]
default_envs = waveshare_290_v2

[env]
platform = espressif32@6.13.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    adafruit/Adafruit GFX Library@^1.11.11
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFB_LIGHT_SLEEP=1

; Waveshare 2.9" e-Paper Module V2 (SSD1680, 296x128) — the recommended panel
[env:waveshare_290_v2]
build_flags = ${env.build_flags} -DFB_PANEL_290_T94_V2

; Older Waveshare 2.9" V1 / generic SSD1608 / IL3820 panels
[env:waveshare_290_v1]
build_flags = ${env.build_flags} -DFB_PANEL_290_V1

; WeAct Studio 2.9" black/white (SSD1680, GDEY029T94 glass)
[env:weact_290]
build_flags = ${env.build_flags} -DFB_PANEL_290_GDEY029T94

; Debug build: no light sleep, so USB serial stays connected
[env:debug]
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DFB_LIGHT_SLEEP=0 -DFB_PANEL_290_T94_V2
